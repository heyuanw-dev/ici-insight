# Local development only. No hosted Supabase project is changed by this file.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "ici-insight-hub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# This provider switch must remain enabled for password login/recovery.
# Public registration is blocked by [auth].enable_signup = false above.
enable_signup = true
enable_confirmations = true

[auth.email.template.invite]
subject = "You’re invited to ICI AI Insight Hub"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your ICI AI Insight Hub password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "50MB"
# The Phase 6 migration provisions the private presentation-slides bucket.

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
